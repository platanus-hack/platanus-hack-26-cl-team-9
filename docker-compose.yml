# Local stack. Only Docker is needed:  docker compose up --build
#   web      http://localhost:5173  (Vite dev server, hot reload; ?mapa=2 needs a Mapbox token, see docs/docker.md)
#   backend  http://localhost:8000  (grid data API, /map test map, /docs)
services:
  backend:
    build:
      context: ./backend
      args:
        WITH_LLM: ${WITH_LLM:-0}  # WITH_LLM=1 docker compose up --build: optional LLM commander and narrative
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: ./backend/.env  # optional; CASCADASEN_* settings only, never keys (docs/docker.md)
        required: false
    environment:
      # Bedrock with temporary credentials exported in your shell (SSO "Set AWS environment variables"):
      # passed through only when set on the host
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_REGION
      # local dev: POST /api/v1/admin/reload enabled; runs (and sessions) persisted in ./data/sessions
      - CASCADASEN_ADMIN_ENABLED=true
      - CASCADASEN_SESSION_STORE=file
    volumes:
      - ./data:/data
      # Bedrock with an AWS profile: uncomment to share ~/.aws read-only with the container
      # - ${HOME}/.aws:/root/.aws:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/docs')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app/web
      - ./data:/app/data
      - /app/web/node_modules

  # Optional: rebuild data/processed from the public sources (needs internet).
  #   docker compose --profile data run --rm data-build [--refresh]
  data-build:
    profiles: ["data"]
    build: ./backend
    command: ["cascadasen-build"]
    volumes:
      - ./data:/data
