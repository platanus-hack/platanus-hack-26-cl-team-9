[project]
name = "cascadasen"
version = "0.1.0"
description = "Simulador abierto de apagones del sistema eléctrico chileno (Platanus Hack 26)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
    "fastapi>=0.165.0",
    "networkx>=3.7",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
cascadasen-api = "cascadasen.api.app:run"
cascadasen-build = "cascadasen.cli:main"
cascadasen-mcp = "cascadasen.mcp.server:main"
cascadasen-cache = "cascadasen.application.cache_builder:main"
cascadasen-sim-fixtures = "cascadasen.sim_fixtures:main"

[project.optional-dependencies]
llm = ["anthropic[bedrock]>=1.0.0"]
mcp = ["mcp>=2.0", "httpx>=0.28"]

[dependency-groups]
dev = ["httpx>=0.28.1", "mypy>=2.4.1", "pytest>=9.2.0", "pytest-cov", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascadasen"]

[tool.hatch.build.targets.wheel.force-include]
"src/cascadasen/api/static" = "cascadasen/api/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
