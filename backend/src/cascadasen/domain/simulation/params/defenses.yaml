    label_key: def_25F
    edac_steps:
      value: [[49.0, 0.05], [48.9, 0.04], [48.8, 0.04], [48.7, 0.04], [48.5, 0.04], [48.3, 0.04]]
      is_assumption: true
      note: "Placeholder for [4] Table 3-10; calibrated on V3b"
