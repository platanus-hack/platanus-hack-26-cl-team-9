# Defence sets (docs/stack.md 4.3-4.6). EDAC steps are [threshold_hz, share of island load].
# The published step tables ([4] Table 3-10, [14] Table 1, [16] Annex E) are not transcribed yet:
# step values below are placeholders declared as assumptions and calibrated on the cases named.
version: 1

sets:
