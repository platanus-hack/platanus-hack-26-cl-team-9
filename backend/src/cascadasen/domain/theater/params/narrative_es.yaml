# Spanish narration templates (docs/stack.md 9: UI strings and narration in Spanish; fixed templates
# so every sentence is reproducible). Keys are the `text_key`, `rationale_key`, `label_key` and
# reason codes the API returns; `{name}` placeholders take the event or decision params.
# Narration describes effects and prevention, never how they could be caused (cyber.md 8).
