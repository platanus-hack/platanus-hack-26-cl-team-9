# Strategic experimentation layer (docs/strategy.md). Every number is a declared assumption of the
# experiment design: the layer models decisions under uncertainty, not a specific utility.
version: 1

clock:
  value: {cycle_minutes: 5, default_horizon: 30, max_horizon: 72, history: 6}
  is_assumption: true
  note: "Operational cycle of 5 minutes; a run covers 2-3 hours (strategy.md 4)"

resources:
  value:
    field_crews: 9
    comms_kits: 4
    fast_reserve_mw: 400
    battery_mw: 300
    analyst_attention: 3
    operator_attention: 4
  is_assumption: true
  note: "Limited defensive resources for one incident. Attention pools refill every cycle (saturation)"

digital:
  value:
    base_noise: 0.02
    base_false_alarm_rate: 0.04
    telemetry_floor: 0.2
    backup_comms_telemetry: 0.7
    backup_comms_delay: 1
    defense_fault_detect_p: 0.5
    control_lost_detect_p: 0.5
    unreliable_detect_p: 0.1
    unreliable_detect_p_tasked: 0.6
    external_notice_p: 0.7
    freq_noise_hz: 0.01
  is_assumption: true
  note: "Supervision quality at uncertainty level 1; level 2 doubles noise and false alarms, level 0 is perfect information"

physics_alarms:
  value:
    band_low_hz: 49.0
    band_high_hz: 51.0
    high_rocof_hz_s: 1.0
    low_inertia_mws: 31000.0
  is_assumption: true
  note: >-
    What supervision flags to the agents (docs/agents.md 1.2): operating band 49.0-51.0 Hz (assumption; the
    first EDAC step is 49.0 Hz, [4]); initial RoCoF of 1 Hz/s (assumption; the 25F reached about 2 Hz/s, [4]);
    island inertia below the 31,000 MWs floor of the secure base case (data/scripts/build_baseline_opf.py)

effects:
  value:
    D1_telemetry_loss: {share: 1.0}
    D2_telemetry_delay: {cycles: 2, duration: 4}
    D3_unreliable_data: {bias: 0.12}
    D4_comms_loss: {}
    D5_false_alarms: {rate: 1.5, duration: 4}
    D6_external_dependency_loss: {lag: 2}
    C1_generation_loss: {share: 0.25}
    C2_common_mode_loss: {share: 0.4, tech: solar}
    C3_transmission_opening: {}
    C4_defense_not_acting: {}
    C5_remote_dispatch_loss: {}
    E1_demand_surge: {share: 0.05}
    E2_renewable_drop: {share: 0.3, tech: solar}
  is_assumption: true
  note: "Default size of each abstract event; effects persist until a defensive action clears them unless a duration is given"

actions:
  value:
    isr_tasking: {costs: {analyst_attention: 1}, duration: 3}
    field_verification: {costs: {field_crews: 1}, duration: 1}
    manual_operation: {costs: {field_crews: 1}}
    backup_comms: {costs: {comms_kits: 1}}
    digital_segmentation: {costs: {}, clears_after: 2}
    preventive_load_reduction: {costs: {}, share: 0.05}
    fast_reserve: {costs: {fast_reserve_mw: 100}, mw: 100}
    battery_support: {costs: {battery_mw: 100}, mw: 100}
    rearm_defense: {costs: {field_crews: 1}, duration: 1}
    islanding_prep: {costs: {}}
    restore_element: {costs: {field_crews: 1}, duration: 2}
    request_external_support: {costs: {}, duration: 3}
  is_assumption: true
  note: "Costs in resource units; duration in cycles (no duration = held until released)"

crews:
  value:
    bases: [A09, A02, A08, A11, A05, A10, A03, A07, A13]
    mobilisation_cycles: 2
    road_speed_kmh: 90
    road_factor: 1.25
    travel_sigma: 0.25
    max_eta_cycles: 18
  is_assumption: true
  note: "Field crew deployment: home bases in priority order (the first `field_crews` are used), 10 min mobilisation, road travel between area centroids at 90 km/h with a 1.25 road-to-straight-line factor and lognormal spread; Logistics does not send a crew that would arrive after 90 min"

stochastic:
  value:
    effect_share_concentration: 20
    effect_mw_sigma: 0.25
    defense_misoperation_p: 0.03
    background_event_p: 0.05
    background_events:
      E1_demand_surge: {weight: 0.6, share: 0.04}
      E2_renewable_drop: {weight: 0.4, share: 0.15, tech: solar}
    action_success_p:
      manual_operation: 0.95
      backup_comms: 0.9
      digital_segmentation: 0.95
      fast_reserve: 0.97
      battery_support: 0.97
      rearm_defense: 0.85
      islanding_prep: 0.9
      restore_element: 0.9
    repair_sigma: 0.4
    restore_share_sigma: 0.3
    field_miss_p: 0.1
  is_assumption: true
  note: "Chance in the world (strategy.md 4): event sizes around catalog defaults (Beta with concentration, lognormal sigma), defence functions failing to act per transient, unplanned external events per cycle, first-attempt action success, repair-time and restoration-speed spread, field crews missing a digital issue"

cyber_attack:
  value:
    strike_delay: 2
    spread_cooldown: 3
    spread_p: 0.4
    isolation_p: 0.85
    eradicate_p: 0.65
    generation_share: 0.35
    attack_win_lost_share: 0.8
    min_neighbours: 2
    clean_after_segmented: 2
    crew_max_eta_cycles: 48
    recovered_lost_share: 0.05
  is_assumption: true
  note: >-
    Propagating cyberattack scenario (docs/attack-sim.md 3.2), all at operating-area level and in 5-minute cycles.
    The defaults are the "Normal" difficulty below. An intrusion is latent until it strikes (supervision, remote
    dispatch and part of the area's generation lost); it tries each neighbour every spread_cooldown cycles;
    segmentation stops a jump with isolation_p; an area kept segmented clean_after_segmented cycles or fully
    restored is eradicated with eradicate_p (else it strikes again). The attack wins when 80 % of the demand is
    lost; the defence when no intrusion is left and at most 5 % of the demand is still lost. Crews up to 4 h away
    are sent (48 cycles; 90 min in other runs). Chosen so a run is playable, not calibrated on any incident

cyber_attack_presets:
  value:
    facil:
      label: Fácil
      params: {strike_delay: 4, spread_cooldown: 5, spread_p: 0.2, isolation_p: 0.95, eradicate_p: 0.9, clean_after_segmented: 1, generation_share: 0.15}
      measured: "100 semillas, 9 cuadrillas: la defensa gana 92 % (A), 96 % (B), 91 % (C), en 5 a 8 ciclos"
    normal:
      label: Normal
      params: {strike_delay: 2, spread_cooldown: 3, spread_p: 0.4, isolation_p: 0.85, eradicate_p: 0.65, clean_after_segmented: 2, generation_share: 0.35}
      measured: "100 semillas, 9 cuadrillas: la defensa gana 46 % (A), 71 % (B), 51 % (C); el ataque, 0 a 2 %"
    dificil:
      label: Difícil
      params: {strike_delay: 1, spread_cooldown: 2, spread_p: 0.55, isolation_p: 0.7, eradicate_p: 0.45, clean_after_segmented: 3, generation_share: 0.5}
      measured: "100 semillas, 9 cuadrillas: la defensa gana 0 % (A), 8 % (B), 0 % (C); el ataque, 19 a 32 %"
    muy_dificil:
      label: Muy difícil
      params: {strike_delay: 0, spread_cooldown: 1, spread_p: 0.9, isolation_p: 0.3, eradicate_p: 0.2, clean_after_segmented: 5, generation_share: 0.85}
      measured: "100 semillas, 9 cuadrillas: la defensa gana 0 %; el ataque gana 100 % (A), 93 % (B), 99 % (C)"
  is_assumption: true
  note: >-
    Difficulty presets of the Ciberataque form, measured on 2026-11-22 with the mapa 3 network at nov2026-1300, seeds
    1-100 per preset and rules policy (A reactive, B preventive, C adaptive). The rest of each run ends undecided at
    the 72-cycle horizon. The LLM commander was not measured (no model on the bench)

restoration:
  value: {load_share_per_cycle: 0.3, gen_share_per_cycle: 0.34, manual_slowdown: 0.5, reserve_recovery: 0.5}
  is_assumption: true
  note: "Operational restoration abstraction, not an electrical restoration model (strategy.md 4)"

isr:
  value:
    prior_intentional: 0.1
    lr_multi_area_digital: 3.0
    lr_unreliable_detected: 4.0
    lr_field_confirms_digital: 3.0
    lr_physical_only: 0.6
    lr_persistence: 1.4
    affected_threshold: 0.45
    decay: 0.6
    corroboration_cycles: 2
  is_assumption: true
  note: "Likelihood ratios of the ISR belief update; they set how fast the picture forms"

policies:
  value:
    A: {label_key: policy_A_reactive, light: 0.8, medium: 0.8, heavy: 0.8, preventive: false, reserve_keep: 0.0, prefer_reversible: false, verify_first: false}
    B: {label_key: policy_B_preventive, light: 0.0, medium: 0.3, heavy: 0.3, preventive: true, reserve_keep: 0.0, prefer_reversible: false, verify_first: false}
    C: {label_key: policy_C_adaptive, light: 0.15, medium: 0.45, heavy: 0.7, preventive: false, reserve_keep: 0.3, prefer_reversible: true, verify_first: true}
  is_assumption: true
  note: "Thresholds on ISR confidence per action weight (strategy.md 7)"

adversary:
  value:
    budget: 8
    cooldown: 2
    gamma: 0.2
    costs: {digital: 1, physical: 2}
    objectives:
      reduce_observability: [D1_telemetry_loss, D2_telemetry_delay, D4_comms_loss, D6_external_dependency_loss]
      raise_uncertainty: [D3_unreliable_data, D5_false_alarms, D2_telemetry_delay]
      pressure_resources: [D5_false_alarms, D4_comms_loss, C5_remote_dispatch_loss]
      provoke_unnecessary_actions: [D5_false_alarms, D3_unreliable_data]
      complicate_recovery: [D4_comms_loss, D6_external_dependency_loss, C4_defense_not_acting, C1_generation_loss]
  is_assumption: true
  note: "Abstract catalog only (cyber.md 8 item 7); EXP3 exploration rate gamma"

missions:
  value:
    utility_continuity:
      label_key: mission_utility_continuity
      priority_areas: [A09, A08]
      continuity_threshold: 0.95
      priority_threshold: 0.99
      observability_threshold: 0.9
      worst_acceptable_level: L1
  is_assumption: true
  note: "Priority areas are a population-density proxy until critical-load data exists (cyber.md 9)"
